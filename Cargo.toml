[package]
name = "runtime-profiler"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Deterministic runtime evidence capture for coding agents and Moonlight"
publish = false

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[dev-dependencies]
tempfile = "3.20"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
