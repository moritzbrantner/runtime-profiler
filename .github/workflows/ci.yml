name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  findings:
    name: Deterministic Findings
    permissions:
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@cb8784b429dc411ad794aac4c1bb3f490ebe092e
    with:
      operation: findings
      report_path: .artifacts/coding-tooling/findings.json

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Generate dependency lockfile
        run: cargo generate-lockfile

      - name: Install contract validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check contracts
        run: python3 scripts/check_contracts.py

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked

      - name: Smoke capture
        run: |
          cargo run --locked -- capture --scenario examples/command.yaml --output target/smoke-bundle
          cargo run --locked -- validate --bundle target/smoke-bundle
          cargo run --locked -- summarize --bundle target/smoke-bundle --json
          cargo run --locked -- render-agent-guidance --bundle target/smoke-bundle
          cargo run --locked -- evidence-reference --bundle target/smoke-bundle --uri .agent-loop/evidence/runtime-profiler/smoke-bundle > target/smoke-evidence-reference.json
          python3 scripts/check_contracts.py --evidence-reference target/smoke-evidence-reference.json

      - name: Preserve generated lockfile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error
