name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: runtime-profiler-ci-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  findings:
    name: Deterministic Findings
    permissions:
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@159701da0842f885d786fc8109c1de32f7dc0128
    with:
      operation: findings
      report_path: .artifacts/coding-tooling/findings.json

  tooling-fast:
    name: Coding Tooling Fast
    permissions:
      contents: read
    uses: moritzbrantner/reusable-workflows/.github/workflows/coding-tooling-validation.yml@159701da0842f885d786fc8109c1de32f7dc0128
    with:
      operation: run
      tier: fast
      report_path: .artifacts/coding-tooling/fast.json

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out exact revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"

      - name: Install Pages dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # immutable action revision
        with:
          toolchain: "1.99.1"
          components: rustfmt, clippy

      - name: Install contract validation dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Check contracts
        run: python3 scripts/check_contracts.py

      - name: Verify TypeScript Pages surfaces
        run: npm run verify:pages

      - name: Run Rust integration tests
        run: cargo test --locked --test '*'

      - name: Smoke capture
        run: |
          cargo run --locked -- capture --scenario examples/command.yaml --output target/smoke-bundle
          cargo run --locked -- validate --bundle target/smoke-bundle
          cargo run --locked -- summarize --bundle target/smoke-bundle --json
          cargo run --locked -- score --reference target/smoke-bundle --candidate target/smoke-bundle --json
          cargo run --locked -- render-agent-guidance --bundle target/smoke-bundle
          cargo run --locked -- evidence-reference --bundle target/smoke-bundle --uri .agent-loop/evidence/runtime-profiler/smoke-bundle > target/smoke-evidence-reference.json
          python3 scripts/check_contracts.py --evidence-reference target/smoke-evidence-reference.json

  merge-ready:
    name: merge-ready
    if: ${{ always() }}
    needs: ["findings", "tooling-fast", "verify"]
    runs-on: ubuntu-latest
    steps:
      - uses: moritzbrantner/reusable-workflows/.github/actions/merge-ready@b0f25f241d76af2584dfc9e375084ff5c5cb97da
        with:
          needs: ${{ toJSON(needs) }}
          required: '["findings", "tooling-fast", "verify"]'
