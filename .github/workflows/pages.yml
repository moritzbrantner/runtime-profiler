name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.pages.json"
      - "pages.config.json"
      - "scripts/build_pages.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@fd22697af1dfc42e4b8d66e222e1a7c415da2be0
    with:
      node_version: "24"
      bun_version: ""
      install_command: "npm ci --ignore-scripts --no-audit --no-fund"
      build_command: "npm run build:pages"
      artifact_path: dist
      cache_bun: false
      cache_node: false
      concurrency_group: runtime-profiler-pages
      cancel_in_progress: true
