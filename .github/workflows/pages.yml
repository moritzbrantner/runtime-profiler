name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "package.json"
      - "package-lock.json"
      - "tsconfig.pages.json"
      - "pages.config.json"
      - "scripts/build_pages.sh"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  packages: read
  pages: write
  id-token: write

jobs:
  pages-preflight:
    name: Pages preflight
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
    steps:
      - name: Check repository Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          status="$({
            curl --silent --show-error \
              --output /tmp/pages.json \
              --write-out '%{http_code}' \
              --header "Authorization: Bearer $GH_TOKEN" \
              --header "Accept: application/vnd.github+json" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/pages"
          })"

          case "$status" in
            200)
              echo "enabled=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "enabled=false" >> "$GITHUB_OUTPUT"
              {
                echo "## GitHub Pages is not enabled yet"
                echo
                echo "Enable **Settings → Pages → Build and deployment → Source: GitHub Actions** once for this repository."
                echo "After that, the next push to main (or a manual workflow dispatch) will deploy automatically."
              } >> "$GITHUB_STEP_SUMMARY"
              ;;
            *)
              cat /tmp/pages.json >&2 || true
              echo "Unexpected GitHub Pages API status: $status" >&2
              exit 1
              ;;
          esac

  deploy:
    name: Deploy Pages
    needs: pages-preflight
    if: ${{ needs.pages-preflight.outputs.enabled == 'true' }}
    permissions:
      actions: read
      contents: read
      id-token: write
      packages: read
      pages: write
    uses: moritzbrantner/reusable-workflows/.github/workflows/deploy-pages.yml@fd22697af1dfc42e4b8d66e222e1a7c415da2be0
    with:
      node_version: "24"
      bun_version: ""
      install_command: "npm ci --ignore-scripts --no-audit --no-fund"
      build_command: "npm run build:pages"
      artifact_path: dist
      cache_bun: false
      cache_node: false
      concurrency_group: runtime-profiler-pages
      cancel_in_progress: true
